<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>micro-flow demo</title>
  <link rel="stylesheet" href="/css/demo.css" />
  <script type="importmap">
    { "imports": { "micro-flow": "/vendor/micro-flow.js" } }
  </script>
</head>
<body>

  <h1>micro-flow &mdash; box tour demo</h1>

  <div class="arena" id="arena">
    <div class="box" id="box"></div>
  </div>

  <!-- Status panel -->
  <div class="status-panel">
    <h2>Workflow Status</h2>
    <div class="step-type-badge" id="step-type-badge">—</div>
    <div class="stat-row">
      <span class="stat-label">Step</span>
      <span class="stat-value" id="step-name">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Callable</span>
      <span class="stat-value" id="callable-name">—</span>
    </div>
    <div class="counter">Laps completed: <span id="laps">0</span></div>
  </div>

  <script type="module" src="/js/box-tour.js"></script>
</body>
</html>
