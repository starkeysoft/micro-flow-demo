services:
  micro-flow-demo:
    build: .
    ports:
      - "8082:8081"
    restart: always

  # Public access through Tailscale Funnel. Only starts with
  # `docker compose --profile funnel up`; needs TS_AUTHKEY in .env.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    hostname: micro-flow
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - micro-flow-demo
    restart: always
    profiles:
      - funnel

volumes:
  tailscale-state:
